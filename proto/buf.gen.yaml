version: v2
# Combined template: `buf generate` runs every language. The per-language
# templates (buf.gen.go.yaml, buf.gen.ts.yaml, buf.gen.python.yaml) are what
# the Makefile uses so one failing toolchain does not block the others.
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: ../libs/proto-gen/src/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.5.1
    out: ../libs/proto-gen/src/go
    opt: paths=source_relative
  - local: protoc-gen-ts_proto
    out: ../libs/proto-gen/src/ts
    opt:
      - stringEnums=true
      - removeEnumPrefix=true
      - outputServices=false
      - outputClientImpl=false
      - unrecognizedEnum=false
      - useOptionals=messages
      - exportCommonSymbols=false
      - esModuleInterop=true
      - useDate=string
      - forceLong=number
  - remote: buf.build/protocolbuffers/python:v33.4
    out: ../libs/proto-gen/src/python
  - remote: buf.build/protocolbuffers/pyi:v33.4
    out: ../libs/proto-gen/src/python
