<div class="timeline-strip">
  <!-- Playback Controls -->
  <div class="playback-controls">
    <button class="playback-btn" (click)="skipBackward()" title="Skip Backward" aria-label="Skip backward">
      <app-icon name="skip-back" [size]="14" />
    </button>
    <button
      class="playback-btn play-btn"
      (click)="togglePlayback()"
      [title]="playing() ? 'Pause' : 'Play'"
      [attr.aria-label]="playing() ? 'Pause' : 'Play'">
      @if (playing()) {
        <app-icon name="pause" [size]="14" />
      } @else {
        <app-icon name="play" [size]="14" />
      }
    </button>
    <button class="playback-btn" (click)="skipForward()" title="Skip Forward" aria-label="Skip forward">
      <app-icon name="skip-forward" [size]="14" />
    </button>
    <button class="playback-btn" (click)="resetTime()" title="Reset to Now" aria-label="Reset to now">
      <app-icon name="square" [size]="14" />
    </button>
  </div>

  <!-- Speed Selector -->
  <div class="speed-control">
    <span class="speed-label">Speed:</span>
    @for (s of speeds; track s) {
      <button
        class="speed-btn"
        [class.active]="speed() === s"
        (click)="setSpeed(s)">
        {{ s }}x
      </button>
    }
  </div>

  <!-- Timeline Visualization -->
  <div class="timeline-canvas-container">
    <canvas #timelineCanvas class="timeline-canvas"></canvas>
    <div #brushOverlay class="brush-overlay"></div>
  </div>

  <!-- Time Display -->
  <div class="time-display">
    <span class="time-current mono">{{ formatTime(currentTime()) }}</span>
    @if (brushStart() && brushEnd()) {
      <span class="time-range mono">
        {{ formatTime(brushStart()!) }} &mdash; {{ formatTime(brushEnd()!) }}
      </span>
    }
  </div>
</div>
