# Static site, shared by every deployment. Included inside a server block, from
# /etc/nginx/sentinel/static.conf in the image: the Compose default.conf adds the
# API, WebSocket and Keycloak proxy blocks around it; the Helm chart replaces
# default.conf and includes only this file.
root /usr/share/nginx/html;
index index.html;

# Gzip compression
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
gzip_min_length 256;

# Cache static assets (build output is content-hashed)
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# The shell names the hashed bundles, so it must be revalidated on every load.
location = /index.html {
    add_header Cache-Control "no-cache";
}

# Runtime settings written at container start by 40-sentinel-config.sh
location = /config.json {
    alias /var/run/sentinel/config.json;
    default_type application/json;
    add_header Cache-Control "no-store";
}

# Angular SPA fallback - serve index.html for all routes
location / {
    try_files $uri $uri/ /index.html;
}

# Health check
location /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
}
