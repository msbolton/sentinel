      - {lat: 54.5935, lon: -3.1625}
      - {lat: 54.5865, lon: -3.1650}
      - {lat: 54.5820, lon: -3.1640}
      - {lat: 54.5750, lon: -3.1612}
      - {lat: 54.5640, lon: -3.1592}
      - {lat: 54.5545, lon: -3.1500}
      - {lat: 54.5545, lon: -3.1462}
      - {lat: 54.5630, lon: -3.1384}
      - {lat: 54.5680, lon: -3.1349}
      - {lat: 54.5720, lon: -3.1332}
      - {lat: 54.5760, lon: -3.1316}
      - {lat: 54.5800, lon: -3.1323}
      - {lat: 54.5850, lon: -3.1350}
      - {lat: 54.5935, lon: -3.1395}
      - {lat: 54.5988, lon: -3.1385}
  # A walker up the ridge from Hawes End to the top of Cat Bells and back:
  # on the hillside the camera looks at.
  - id: walker-catbells
    kind: person
    displayName: Cat Bells walker
    speedKts: 2.5
    loop: true
    waypoints:
      - {lat: 54.5870, lon: -3.1660}
      - {lat: 54.5800, lon: -3.1690}
      - {lat: 54.5740, lon: -3.1700}
