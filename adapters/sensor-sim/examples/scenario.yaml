      - {lat: 54.5800, lon: -3.1690}
  # A drone crossing Derwentwater from the west shore to the east and back,
  # 100 m above the water, right across the camera's view with the slopes of
  # Cat Bells and Borrowdale behind it.
  - id: drone-lake
    kind: drone
    displayName: Lake drone
    speedKts: 30
    heightAboveGroundM: 100
    loop: true
    waypoints:
      - {lat: 54.5850, lon: -3.1680}
      - {lat: 54.5800, lon: -3.1300}
  # A drone circling over Keswick 120 m above the rooftops.
  - id: drone-town
    kind: drone
    displayName: Town drone
    speedKts: 25
    heightAboveGroundM: 120
    loop: true
    waypoints:
      - {lat: 54.6040, lon: -3.1500}
      - {lat: 54.5960, lon: -3.1500}
      - {lat: 54.5960, lon: -3.1250}
      - {lat: 54.6040, lon: -3.1250}
