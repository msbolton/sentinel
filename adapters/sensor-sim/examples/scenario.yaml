      - {lat: 54.5935, lon: -3.1050}
  # Keswick to Portinscale and down the lane under Cat Bells to Grange,
  # back by the B5289 to Keswick: a loop round Derwentwater.
  - id: van-catbells
    kind: vehicle
    displayName: Cat Bells van
    speedKts: 20
    loop: true
    waypoints:
      - {lat: 54.6005, lon: -3.1430}
