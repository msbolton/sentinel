[project]
name = "sentinel-proto"
version = "0.1.0"
description = "Generated sentinel.v1 protobuf messages"
requires-python = ">=3.11"
dependencies = ["protobuf>=5.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinel*"]
