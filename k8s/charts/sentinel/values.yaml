# SENTINEL Helm Chart Values
# Override these for each environment (dev, staging, prod)

global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# -- Application Services --

apiGateway:
  replicaCount: 2
  image:
    repository: sentinel/api-gateway
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  env:
    DB_HOST: "{{ .Release.Name }}-postgresql"
    KAFKA_BROKERS: "{{ .Release.Name }}-kafka:9092"
    KEYCLOAK_URL: "http://{{ .Release.Name }}-keycloak"

entityService:
  replicaCount: 2
  image:
    repository: sentinel/entity-service
    tag: latest
  service:
    port: 3001
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

trackService:
  replicaCount: 2
  image:
    repository: sentinel/track-service
    tag: latest
  service:
    port: 3002
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi

searchService:
  replicaCount: 1
  image:
    repository: sentinel/search-service
    tag: latest
  service:
    port: 3003
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

linkAnalysisService:
  replicaCount: 1
  image:
    repository: sentinel/link-analysis-service
    tag: latest
  service:
    port: 3004
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

alertService:
  replicaCount: 2
  image:
    repository: sentinel/alert-service
    tag: latest
  service:
    port: 3005
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

ingestService:
  # Feeds are leased so each runs on exactly one replica; scale freely.
  replicaCount: 3
  image:
    repository: sentinel/ingest-service
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 4000
  resources:
    requests:
      cpu: 1000m
      memory: 256Mi
    limits:
      cpu: 4000m
      memory: 512Mi
  # Secret holding INGEST_SERVICE_TOKEN (and optional OPENSKY_CLIENT_ID /
  # OPENSKY_CLIENT_SECRET). Leave existingSecret empty to have the chart
  # create one from the values below.
  existingSecret: ""
  serviceToken: ""
  opensky:
    clientId: ""
    clientSecret: ""
  lease:
    ttlSec: 15
    tickSec: 2
    rebalanceSec: 30
  env: {}
  # TAK connection certificates, mounted at mountPath so feeds can reference
  # them as file:/etc/sentinel/tak/client.pem etc. Either name an existing
  # Secret with keys tak-client-cert, tak-client-key and tak-ca, or set the
  # PEM values here and the chart creates one.
  tak:
    existingSecret: ""
    clientCert: ""
    clientKey: ""
    ca: ""
    mountPath: /etc/sentinel/tak
  # Files for feed secretRefs to name as file:/etc/sentinel/secrets/<key>, such
  # as the PEMs of a TCP connection with mutual TLS. Name an existing Secret:
  # each of its keys becomes a file under mountPath (mode 0440), so each key
  # must be a valid file name. The kubelet refreshes the files within about a
  # minute of a change to the Secret. Leave existingSecret empty to mount none.
  secretFiles:
    existingSecret: ""
    mountPath: /etc/sentinel/secrets
  # A Secret whose keys become environment variables of the ingest and listener
  # pods, for secretRefs to name as env:KEY (env above takes plain values only).
  # Leave existingSecret empty to add none.
  secretEnv:
    existingSecret: ""
  # Needs the Prometheus Operator CRDs. Renders a ServiceMonitor for the ingest
  # service and, while the listener is enabled, a PodMonitor for the listener,
  # which has no Service.
  serviceMonitor:
    enabled: false
    interval: 30s

ingestListener:
  # Runs the TCP/UDP connections external systems send to, with
  # hostNetwork on a labelled node so any port chosen in Connections is
  # reachable on that node's address. Open those ports in the node's
  # firewall or security group. Label the node first, or the Pod stays
  # Pending: kubectl label node <name> sentinel.io/ingest-listener=true
  enabled: true
  host: ""            # address senders use; defaults to the node IP
  # false: the listener runs listening connections and the feeds pinned to it,
  # nothing else, so ordinary feeds need an ingest-service replica. true: it
  # also takes its rendezvous share of the ordinary feeds.
  shared: false
  nodeSelector:
    sentinel.io/ingest-listener: "true"
  resources:
    requests: { cpu: 250m, memory: 128Mi }
    limits: { cpu: 2000m, memory: 512Mi }

# Go behavioural-analysis service. One replica: detector state is in process
# and the hourly baseline job takes a Postgres advisory lock, so a second
# replica would be harmless but is not planned for.
analyticsService:
  replicaCount: 1
  image:
    repository: sentinel/analytics-service
    tag: latest
  service:
    port: 5000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  # Extra environment (ANALYTICS_* thresholds; see apps/analytics-service/internal/config)
  env: {}

web:
  replicaCount: 2
  image:
    repository: sentinel/web
    tag: latest
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: sentinel.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

# -- Infrastructure --

postgresql:
  enabled: true
  auth:
    database: sentinel
    username: sentinel
    password: sentinel_dev
  primary:
    initdb:
      scripts:
        init-extensions.sql: |
          CREATE EXTENSION IF NOT EXISTS postgis;
          CREATE EXTENSION IF NOT EXISTS postgis_topology;
          CREATE EXTENSION IF NOT EXISTS timescaledb;
          CREATE EXTENSION IF NOT EXISTS age;
          LOAD 'age';
          SET search_path = ag_catalog, "$user", public;
          SELECT create_graph('entity_graph');
          -- Owned by the role the services connect as, so that the dbSchema Job
          -- (which runs as that role) can create and alter the tables. The name
          -- must be postgresql.auth.username; a values file is not templated.
          CREATE SCHEMA IF NOT EXISTS sentinel AUTHORIZATION sentinel;
          -- The GeoServer role, created here without a password so that
          -- 90_gis_views.sql finds it and needs no CREATEROLE. It cannot log in
          -- until ALTER ROLE sentinel_gis PASSWORD sets one.
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sentinel_gis') THEN
              CREATE ROLE sentinel_gis LOGIN;
            END IF;
          END
          $$;
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi
    persistence:
      size: 50Gi

# Applies db/schema with a Helm hook Job: after the first install creates the
# release's resources, and before every upgrade (a failing Job aborts it). It
# runs the files in name order, every one idempotent. Helm waits for the Job
# only as long as --timeout (5m by default); pass --timeout 15m to wait as long
# as the Job may run (activeDeadlineSeconds). On a first install leave out
# --wait and --atomic: Helm would wait for ingest pods that cannot start until
# this Job has run. Needs Helm: kubectl apply of the rendered chart ignores
# hooks.
#
# What the database must provide for the Job to work as a plain role:
# - The Job connects as the role in the database-url key of the
#   <release>-postgresql Secret. That role must be postgresql.auth.username, the
#   role the services and the gateway use. No chart template creates the key;
#   the operator supplies it.
# - That role owns schema sentinel, and the role sentinel_gis exists. The
#   postgresql initdb script above creates both, but only on an empty data
#   directory: an existing release needs, once and as a superuser, ALTER SCHEMA
#   sentinel OWNER TO <role> and CREATE ROLE sentinel_gis LOGIN.
# - sentinel_gis has no password, so it cannot log in until ALTER ROLE
#   sentinel_gis PASSWORD ... sets the one GeoServer's provisioning uses
#   (GIS_DB_PASSWORD, from geoserver.gisDbPassword).
dbSchema:
  enabled: true
  image: postgres:16-alpine   # needs psql and pg_isready
  backoffLimit: 10
  activeDeadlineSeconds: 900
  # Small but present, so a namespace ResourceQuota that demands requests and
  # limits cannot reject the hook pod.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

kafka:
  enabled: true
  kraft:
    enabled: true
  controller:
    replicaCount: 3
  listeners:
    client:
      protocol: PLAINTEXT
  provisioning:
    enabled: true
    topics:
      - name: observations.raw
        partitions: 24
        replicationFactor: 3
      - name: observations.dlq
        partitions: 3
        replicationFactor: 3
      - name: entities.events
        partitions: 12
        replicationFactor: 3
      - name: alerts.events
        partitions: 3
        replicationFactor: 3
      - name: density.events
        partitions: 1
        replicationFactor: 3

opensearch:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi

keycloak:
  enabled: true
  auth:
    adminUser: admin
    adminPassword: admin
  extraEnvVars:
    - name: KEYCLOAK_EXTRA_ARGS
      value: "--import-realm"

minio:
  enabled: true
  auth:
    rootUser: minio
    rootPassword: minio123
  defaultBuckets: "sentinel-imagery,sentinel-reports,sentinel-tiles,sentinel-exports"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

# -- Monitoring --

monitoring:
  enabled: false
  prometheus:
    enabled: false
  grafana:
    enabled: false
  loki:
    enabled: false
  jaeger:
    enabled: false

# -- GeoServer (OGC WMS/WFS layers over the PostGIS views; config/geoserver) --
geoserver:
  enabled: false
  image:
    repository: kartoza/geoserver
    tag: "2.25.2"
    pullPolicy: IfNotPresent
  adminUser: admin
  # Used only when existingSecret is empty. existingSecret keys: admin-password,
  # gis-db-password, gis-user-password-u/-c/-s/-ts.
  adminPassword: change-me
  gisDbPassword: change-me
  gisUserPasswords:
    u: change-me
    c: change-me
    s: change-me
    ts: change-me
  existingSecret: ""
  dbHost: "{{ .Release.Name }}-postgresql"
  persistence:
    size: 5Gi
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 1500m
      memory: 2Gi
  env:
    INITIAL_MEMORY: 512m
    MAXIMUM_MEMORY: 1536m
