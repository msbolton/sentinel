# SENTINEL Helm Chart Values
# Override these for each environment (dev, staging, prod)

global:
  # Public hostname the deployment is served on, without a scheme. The chart
  # derives the CORS origin, the token issuers and the Ingress host from it.
  host: ""
  # Private registry holding the Sentinel images (make images-push REGISTRY=...):
  # images are <imageRegistry>/<repository>:<tag>. Empty pulls <repository>:<tag>
  # from the node's default registry. Third-party images (PostgreSQL, GeoServer,
  # curl) are never prefixed with it.
  imageRegistry: ""
  # Tag of every Sentinel image that sets no tag of its own. Empty falls back to
  # the chart's appVersion.
  imageTag: ""
  # Secrets of type kubernetes.io/dockerconfigjson for the private registry, as
  # [{name: registry-credentials}], added to every pod.
  imagePullSecrets: []
  # StorageClass of every volume the chart claims (PostgreSQL, Kafka,
  # OpenSearch, GeoServer). Empty uses the cluster's default class.
  storageClass: ""
  # DNS domain of the cluster, for the fully qualified Service names the chart
  # hands out (Kafka's advertised listener).
  clusterDomain: cluster.local

# -- Application Services --

apiGateway:
  enabled: true
  replicaCount: 2
  image:
    repository: sentinel/api-gateway
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

entityService:
  replicaCount: 2
  image:
    repository: sentinel/entity-service
    tag: ""
  service:
    port: 3001
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

trackService:
  replicaCount: 2
  image:
    repository: sentinel/track-service
    tag: ""
  service:
    port: 3002
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi

searchService:
  replicaCount: 1
  image:
    repository: sentinel/search-service
    tag: ""
  service:
    port: 3003
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

linkAnalysisService:
  replicaCount: 1
  image:
    repository: sentinel/link-analysis-service
    tag: ""
  service:
    port: 3004
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

alertService:
  replicaCount: 2
  image:
    repository: sentinel/alert-service
    tag: ""
  service:
    port: 3005
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

ingestService:
  # Renders the ingest-service Deployment, its Service and Secret (the listener
  # below has a flag of its own).
  enabled: true
  # Feeds are leased so each runs on exactly one replica; scale freely.
  replicaCount: 3
  image:
    repository: sentinel/ingest-service
    tag: ""
    pullPolicy: IfNotPresent
  service:
    port: 4000
  resources:
    requests:
      cpu: 1000m
      memory: 256Mi
    limits:
      cpu: 4000m
      memory: 512Mi
  # Both ingest Deployments (the listener runs the same image) run as 10001, the
  # user of apps/ingest-service/Dockerfile, with every capability dropped: the
  # service binds only ports from 1024 up. fsGroup makes the Secret files (tak
  # and secretFiles, both mounted with mode 0440) readable by the group. A
  # platform that assigns the ids itself needs runAsUser, runAsGroup and fsGroup
  # dropped: set each to null, as in
  # --set ingestService.podSecurityContext.runAsUser=null.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    # false until a full run on a read-only root has been seen working. The
    # service writes no file of its own, so true is expected to work.
    readOnlyRootFilesystem: false
    capabilities:
      drop: [ALL]
  # Secret holding INGEST_SERVICE_TOKEN (and optional OPENSKY_CLIENT_ID /
  # OPENSKY_CLIENT_SECRET). Leave existingSecret empty to have the chart
  # create one from the values below.
  existingSecret: ""
  serviceToken: ""
  opensky:
    clientId: ""
    clientSecret: ""
  lease:
    ttlSec: 15
    tickSec: 2
    rebalanceSec: 30
  env: {}
  # TAK connection certificates, mounted at mountPath (mode 0440) so feeds can
  # reference them as file:/etc/sentinel/tak/client.pem etc. Either name an
  # existing Secret with keys tak-client-cert, tak-client-key and tak-ca, or set
  # the PEM values here and the chart creates one.
  tak:
    existingSecret: ""
    clientCert: ""
    clientKey: ""
    ca: ""
    # A mountPath outside /etc/sentinel needs INGEST_SECRET_FILE_DIRS set (ingestService.env) to name it.
    mountPath: /etc/sentinel/tak
  # Files for feed secretRefs to name as file:/etc/sentinel/secrets/<key>, such
  # as the PEMs of a TCP connection with mutual TLS. Name an existing Secret:
  # each of its keys becomes a file under mountPath (mode 0440), so each key
  # must be a valid file name. The kubelet refreshes the files within about a
  # minute of a change to the Secret. Leave existingSecret empty to mount none.
  secretFiles:
    existingSecret: ""
    # A mountPath outside /etc/sentinel needs INGEST_SECRET_FILE_DIRS set (ingestService.env) to name it.
    mountPath: /etc/sentinel/secrets
  # A Secret whose keys become environment variables of the ingest and listener
  # pods, for secretRefs to name as env:SENTINEL_SECRET_... (env above takes plain values only).
  # Every key of it reaches both pods, through envFrom, and can set any
  # configuration the chart leaves unset (LEASE_ENABLED or
  # FEEDS_BOOTSTRAP_ENABLED, for example). So the keys should be secret
  # material, named for the INGEST_SECRET_ENV_ALLOW policy of the ingest service
  # (default OPENSKY_*,AISSTREAM_*,SENTINEL_SECRET_*), and nothing else.
  # Leave existingSecret empty to add none.
  secretEnv:
    existingSecret: ""
  # Needs the Prometheus Operator CRDs. Renders a ServiceMonitor for the ingest
  # service and, while the listener is enabled, a PodMonitor for the listener,
  # which has no Service.
  serviceMonitor:
    enabled: false
    interval: 30s

ingestListener:
  # Runs the TCP/UDP connections external systems send to, with
  # hostNetwork on a labelled node so any port chosen in Connections is
  # reachable on that node's address. Open those ports in the node's
  # firewall or security group. Label the node first, or the Pod stays
  # Pending: kubectl label node <name> sentinel.io/ingest-listener=true
  enabled: true
  host: ""            # address senders use; defaults to the node IP
  # false: the listener runs listening connections and the feeds pinned to it,
  # nothing else, so ordinary feeds need an ingest-service replica. true: it
  # also takes its rendezvous share of the ordinary feeds.
  shared: false
  nodeSelector:
    sentinel.io/ingest-listener: "true"
  resources:
    requests: { cpu: 250m, memory: 128Mi }
    limits: { cpu: 2000m, memory: 512Mi }

# Go behavioural-analysis service. One replica: detector state is in process
# and the hourly baseline job takes a Postgres advisory lock, so a second
# replica would be harmless but is not planned for.
analyticsService:
  replicaCount: 1
  image:
    repository: sentinel/analytics-service
    tag: ""
  service:
    port: 5000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  # Extra environment (ANALYTICS_* thresholds; see apps/analytics-service/internal/config)
  env: {}

web:
  replicaCount: 2
  image:
    repository: sentinel/web
    tag: ""
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: sentinel.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

# -- Infrastructure --
# The data tier (PostgreSQL, Kafka, OpenSearch, Keycloak) is added to this
# chart as templates with their own values; none comes from a subchart. Each is
# a one-replica StatefulSet with a volume from global.storageClass: the chart
# targets a single node, where backups matter more than failover.

# PostgreSQL 16 with PostGIS 3.4, the image Compose runs. Its first start, on an
# empty volume, runs an initdb script as the superuser postgres: it creates the
# login roles sentinel and keycloak with their databases, PostGIS and the
# optional extensions of config/postgres/init-extensions.sql in sentinel, schema
# sentinel owned by the role sentinel, and sentinel_gis (LOGIN, no password).
# Later starts skip it, so changing a password in the Secret afterwards does not
# change it in the database: ALTER ROLE as well.
postgresql:
  enabled: true
  image:
    # amd64 only. On an arm64 node (k3d on Apple silicon) use a multi-arch
    # build, such as imresamu/postgis:16-3.4.
    repository: postgis/postgis
    tag: "16-3.4"
    pullPolicy: IfNotPresent
  # Secret with the keys postgres-password (the superuser postgres), username
  # (sentinel), password (sentinel's), keycloak-password and database-url
  # (postgres://sentinel:<password>@<fullname>-postgresql:5432/sentinel?sslmode=disable).
  # Empty: the chart generates <fullname>-postgresql with random passwords, keeps
  # them across upgrades, and leaves the Secret behind on helm uninstall
  # (helm.sh/resource-policy: keep) so a reinstall finds the volume's passwords.
  existingSecret: ""
  persistence:
    size: 50Gi
  # Memory-backed /dev/shm for parallel queries (a container gets 64 MB).
  shmSize: 256Mi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  # The image's postgres user (999 in the Debian-based image). fsGroup makes the
  # volume writable; the data directory is a subdirectory of it (PGDATA), since
  # initdb refuses a mount point that holds lost+found.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

# Apache Kafka in KRaft combined mode (broker and controller in one process),
# the image and cluster id Compose uses. Clients use PLAINTEXT on 9092 (the
# NetworkPolicies keep it in the namespace); the controller listens on 9093.
kafka:
  enabled: true
  image:
    repository: apache/kafka
    tag: "3.7.0"
    pullPolicy: IfNotPresent
  # The KRaft cluster id the volume is formatted with. Changing it on an
  # existing volume stops the broker from starting.
  clusterId: MkU3OEVBNTcwNTJENDM2Qk
  heapOpts: "-Xms768m -Xmx768m"
  persistence:
    size: 20Gi
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 1536Mi
  # The topics of config/kafka/create-topics.sh, created by a hook Job after a
  # first install and before every upgrade (it skips topics that exist).
  topics:
    enabled: true
    # One broker, so one replica of each partition.
    replicationFactor: 1
    backoffLimit: 6
    activeDeadlineSeconds: 600
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  # appuser (1000) of the image, for the broker and the topics Job.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  # Not read-only: the image writes server.properties from the environment at
  # start.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: [ALL]

# OpenSearch, single node, with the security plugin off: no TLS and no login,
# so only the NetworkPolicies keep other pods out. Single-node discovery skips
# the bootstrap checks, so the node needs no vm.max_map_count change (a low one
# still logs a warning).
opensearch:
  enabled: true
  image:
    repository: opensearchproject/opensearch
    tag: "2.17.1"
    pullPolicy: IfNotPresent
  javaOpts: "-Xms1g -Xmx1g"
  persistence:
    size: 20Gi
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 2Gi
  # The image's opensearch user (1000).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  # Not read-only: OpenSearch writes its keystore and logs under
  # /usr/share/opensearch.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: [ALL]

# Applies db/schema with a Helm hook Job: after the first install creates the
# release's resources, and before every upgrade (a failing Job aborts it). It
# runs the files in name order, every one idempotent. Helm waits for the Job
# only as long as --timeout (5m by default); pass --timeout 15m to wait as long
# as the Job may run (activeDeadlineSeconds). On a first install leave out
# --wait and --atomic: Helm would wait for ingest pods that cannot start until
# this Job has run. Needs Helm: kubectl apply of the rendered chart ignores
# hooks.
#
# What the database must provide for the Job to work as a plain role:
# - The Job connects as the role in the database-url key of the
#   <fullname>-postgresql Secret (or postgresql.existingSecret), the role the
#   services and the gateway use.
# - That role owns schema sentinel, and the role sentinel_gis exists. The
#   chart's PostgreSQL creates both at its first start (postgresql above), but
#   only on an empty data directory: another database needs, once and as a
#   superuser, ALTER SCHEMA sentinel OWNER TO <role> and CREATE ROLE
#   sentinel_gis LOGIN.
# - sentinel_gis has no password, so it cannot log in until ALTER ROLE
#   sentinel_gis PASSWORD ... sets the one GeoServer's provisioning uses
#   (GIS_DB_PASSWORD, from geoserver.gisDbPassword).
dbSchema:
  enabled: true
  image: postgres:16-alpine   # needs psql and pg_isready
  backoffLimit: 10
  activeDeadlineSeconds: 900
  # Small but present, so a namespace ResourceQuota that demands requests and
  # limits cannot reject the hook pod.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # Not root, with the hardening of the ingest pods (no fsGroup: its one volume
  # is a ConfigMap, readable by all). The id is the chart's 10001, not the
  # image's own postgres user (70 in the Alpine tags, 999 in the Debian ones):
  # that way the chart names one id, whatever image is set above. psql and
  # pg_isready need no passwd entry, home directory or writable path, only a
  # DATABASE_URL that names its user. Set a key to null to drop it.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

# -- GeoServer (OGC WMS/WFS layers over the PostGIS views; config/geoserver) --
geoserver:
  enabled: false
  image:
    repository: kartoza/geoserver
    tag: "2.25.2"
    pullPolicy: IfNotPresent
  adminUser: admin
  # Used only when existingSecret is empty. existingSecret keys: admin-password,
  # gis-db-password, gis-user-password-u/-c/-s/-ts.
  adminPassword: change-me
  gisDbPassword: change-me
  gisUserPasswords:
    u: change-me
    c: change-me
    s: change-me
    ts: change-me
  existingSecret: ""
  # Empty: the chart's own PostgreSQL. A value is run through tpl.
  dbHost: ""
  persistence:
    size: 5Gi
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 1500m
      memory: 2Gi
  env:
    INITIAL_MEMORY: 512m
    MAXIMUM_MEMORY: 1536m
