{{- /*
The six backend services behind the gateway, one Deployment and one Service
each (and a ServiceMonitor with appServices.serviceMonitor.enabled). Each entry
names its values key, its workload name, whether it reads Kafka, and its fixed
replica count when it has one.
*/}}
{{- $services := list
  (dict "key" "entityService" "name" "entity-service" "kafka" true)
  (dict "key" "trackService" "name" "track-service" "kafka" true)
  (dict "key" "searchService" "name" "search-service" "kafka" true)
  (dict "key" "linkAnalysisService" "name" "link-analysis-service" "kafka" false)
  (dict "key" "alertService" "name" "alert-service" "kafka" true)
  (dict "key" "analyticsService" "name" "analytics-service" "kafka" true "replicas" 1)
}}
{{- range $services }}
{{- if (index $.Values .key).enabled }}
{{ include "sentinel.appService" (merge (dict "ctx" $) .) }}
{{- end }}
{{- end }}

{{- define "sentinel.appService" -}}
{{- $ := .ctx -}}
{{- $v := index $.Values .key -}}
{{- $shared := $.Values.appServices -}}
{{- $fullname := printf "%s-%s" (include "sentinel.fullname" $) .name -}}
{{- $reserved := list "PORT" "DATABASE_URL" "KAFKA_BROKERS" "CORS_ORIGIN" -}}
{{- if eq .name "search-service" }}
{{- $reserved = concat $reserved (list "OPENSEARCH_HOST" "OPENSEARCH_PORT") -}}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "sentinel.labels" (dict "ctx" $ "component" .name "tier" "api") | nindent 4 }}
spec:
  replicas: {{ .replicas | default $v.replicaCount }}
  selector:
    matchLabels:
      {{- include "sentinel.selectorLabels" (dict "ctx" $ "component" .name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sentinel.podLabels" (dict "ctx" $ "component" .name) | nindent 8 }}
    spec:
      {{- with $shared.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (include "sentinel.imagePullSecrets" $) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: {{ .name }}
          image: {{ include "sentinel.image" (dict "ctx" $ "image" $v.image) | quote }}
          imagePullPolicy: {{ $v.image.pullPolicy | default "IfNotPresent" }}
          {{- with $shared.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $v.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ $v.service.port | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "sentinel.postgresSecret" $ }}
                  key: database-url
            {{- if .kafka }}
            - name: KAFKA_BROKERS
              value: {{ include "sentinel.kafkaBrokers" $ }}
            {{- end }}
            - name: CORS_ORIGIN
              value: {{ include "sentinel.publicUrl" $ }}
            {{- if eq .name "search-service" }}
            - name: OPENSEARCH_HOST
              value: {{ $v.opensearch.host | default (include "sentinel.opensearchHost" $) | quote }}
            - name: OPENSEARCH_PORT
              value: {{ $v.opensearch.port | quote }}
            {{- end }}
            {{- with (include "sentinel.extraEnv" (dict "env" $v.env "reserved" $reserved "what" (printf "%s.env" .key))) }}
            {{- . | trim | nindent 12 }}
            {{- end }}
          {{- with $v.secretEnv.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml $v.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "sentinel.labels" (dict "ctx" $ "component" .name) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $v.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "sentinel.selectorLabels" (dict "ctx" $ "component" .name) | nindent 4 }}
{{- if $shared.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "sentinel.labels" (dict "ctx" $ "component" .name) | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "sentinel.selectorLabels" (dict "ctx" $ "component" .name) | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ $shared.serviceMonitor.interval }}
{{- end }}
{{- end }}
