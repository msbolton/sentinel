{{- if .Values.geoserver.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sentinel.fullname" . }}-geoserver-init
  labels:
    {{- include "sentinel.labels" (dict "ctx" $ "component" "geoserver") | nindent 4 }}
data:
  provision.sh: |-
{{ .Files.Get "files/geoserver-provision.sh" | indent 4 }}
  entities.sld: |-
{{ .Files.Get "files/geoserver-entities.sld" | indent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "sentinel.fullname" . }}-geoserver-data
  labels:
    {{- include "sentinel.labels" (dict "ctx" $ "component" "geoserver") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.global.storageClass }}
  storageClassName: {{ .Values.global.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.geoserver.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sentinel.fullname" . }}-geoserver
  labels:
    {{- include "sentinel.labels" (dict "ctx" $ "component" "geoserver" "tier" "gis") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "sentinel.selectorLabels" (dict "ctx" $ "component" "geoserver") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sentinel.podLabels" (dict "ctx" $ "component" "geoserver") | nindent 8 }}
    spec:
      {{- with (include "sentinel.imagePullSecrets" .) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: geoserver
          image: "{{ .Values.geoserver.image.repository }}:{{ .Values.geoserver.image.tag }}"
          imagePullPolicy: {{ .Values.geoserver.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 8600
          env:
            - name: HTTP_PORT
              value: "8600"
            - name: GEOSERVER_DATA_DIR
              value: /opt/geoserver/data_dir
            - name: GEOSERVER_CSRF_DISABLED
              value: "true"
            - name: GEOSERVER_ADMIN_USER
              value: {{ .Values.geoserver.adminUser | quote }}
            - name: GEOSERVER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-geoserver" (include "sentinel.fullname" .)) .Values.geoserver.existingSecret }}
                  key: admin-password
            {{- range $k, $v := .Values.geoserver.env }}
            - name: {{ $k }}
              value: {{ tpl $v $ | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /geoserver/web/
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml .Values.geoserver.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /opt/geoserver/data_dir
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "sentinel.fullname" . }}-geoserver-data
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentinel.fullname" . }}-geoserver
  labels:
    {{- include "sentinel.labels" (dict "ctx" $ "component" "geoserver") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8600
      targetPort: http
  selector:
    {{- include "sentinel.selectorLabels" (dict "ctx" $ "component" "geoserver") | nindent 4 }}
---
{{- if not .Values.geoserver.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sentinel.fullname" . }}-geoserver
  labels:
    {{- include "sentinel.labels" (dict "ctx" $ "component" "geoserver") | nindent 4 }}
type: Opaque
stringData:
  admin-password: {{ .Values.geoserver.adminPassword | quote }}
  gis-db-password: {{ .Values.geoserver.gisDbPassword | quote }}
  gis-user-password-u: {{ .Values.geoserver.gisUserPasswords.u | quote }}
  gis-user-password-c: {{ .Values.geoserver.gisUserPasswords.c | quote }}
  gis-user-password-s: {{ .Values.geoserver.gisUserPasswords.s | quote }}
  gis-user-password-ts: {{ .Values.geoserver.gisUserPasswords.ts | quote }}
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sentinel.fullname" . }}-geoserver-init
  labels:
    {{- include "sentinel.labels" (dict "ctx" $ "component" "geoserver-init") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "sentinel.podLabels" (dict "ctx" $ "component" "geoserver-init") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with (include "sentinel.imagePullSecrets" .) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: provision
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "/scripts/provision.sh"]
          env:
            - name: GEOSERVER_URL
              value: "http://{{ include "sentinel.fullname" . }}-geoserver:8600/geoserver"
            - name: GEOSERVER_ADMIN_USER
              value: {{ .Values.geoserver.adminUser | quote }}
            - name: GIS_DB_HOST
              value: {{ tpl (default (include "sentinel.postgresHost" .) .Values.geoserver.dbHost) . | quote }}
            {{- $sec := default (printf "%s-geoserver" (include "sentinel.fullname" .)) .Values.geoserver.existingSecret }}
            {{- range $env, $key := dict "GEOSERVER_ADMIN_PASSWORD" "admin-password" "GIS_DB_PASSWORD" "gis-db-password" "GIS_USER_PASSWORD_U" "gis-user-password-u" "GIS_USER_PASSWORD_C" "gis-user-password-c" "GIS_USER_PASSWORD_S" "gis-user-password-s" "GIS_USER_PASSWORD_TS" "gis-user-password-ts" }}
            - name: {{ $env }}
              valueFrom:
                secretKeyRef:
                  name: {{ $sec }}
                  key: {{ $key }}
            {{- end }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: {{ include "sentinel.fullname" . }}-geoserver-init
{{- end }}
