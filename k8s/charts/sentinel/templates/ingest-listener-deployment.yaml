{{- if .Values.ingestListener.enabled }}
{{- $secretName := include "sentinel.ingestSecret" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sentinel.fullname" . }}-ingest-listener
  labels:
    {{- include "sentinel.labels" (dict "ctx" $ "component" "ingest-listener" "tier" "ingest") | nindent 4 }}
spec:
  # One replica: it binds ports on a single node's host network.
  replicas: 1
  # Recreate, not RollingUpdate: a hostNetwork pod's ports count as taken on
  # its node, so a surge pod could never schedule beside the old one and the
  # rollout would stall.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "sentinel.selectorLabels" (dict "ctx" $ "component" "ingest-listener") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sentinel.podLabels" (dict "ctx" $ "component" "ingest-listener") | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4010"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      # Host networking so any port chosen in Connections is reachable on the
      # node's address; ClusterFirstWithHostNet keeps cluster DNS working.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        {{- toYaml .Values.ingestListener.nodeSelector | nindent 8 }}
      {{- with .Values.ingestService.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (include "sentinel.imagePullSecrets" .) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: ingest-listener
          image: {{ include "sentinel.image" (dict "ctx" $ "image" .Values.ingestService.image) | quote }}
          imagePullPolicy: {{ .Values.ingestService.image.pullPolicy | default "IfNotPresent" }}
          {{- with .Values.ingestService.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 4010
              protocol: TCP
          env:
            - name: APP_ENV
              value: production
            - name: HTTP_ADDR
              value: ":4010"
            # The Deployment's name, not the pod name, which changes with every
            # rollout: a feed pinned to the listener (config.pinnedReplica) names
            # this id, and the pin would stop matching. One replica and the
            # Recreate strategy mean two pods never hold the id together.
            - name: REPLICA_ID
              value: {{ include "sentinel.fullname" . }}-ingest-listener
            - name: INGEST_LISTENER
              value: "true"
            - name: INGEST_LISTENER_HOST
              {{- if .Values.ingestListener.host }}
              value: {{ .Values.ingestListener.host | quote }}
              {{- else }}
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
              {{- end }}
            - name: INGEST_LISTENER_SHARED
              value: {{ .Values.ingestListener.shared | quote }}
            - name: KAFKA_BROKERS
              value: {{ include "sentinel.kafkaBrokers" . }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "sentinel.postgresSecret" . }}
                  key: database-url
            - name: INGEST_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: service-token
            - name: OPENSKY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: opensky-client-id
                  optional: true
            - name: OPENSKY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: opensky-client-secret
                  optional: true
            - name: LEASE_TTL_SEC
              value: {{ .Values.ingestService.lease.ttlSec | quote }}
            - name: LEASE_TICK_SEC
              value: {{ .Values.ingestService.lease.tickSec | quote }}
            - name: LEASE_REBALANCE_SEC
              value: {{ .Values.ingestService.lease.rebalanceSec | quote }}
            - name: SHUTDOWN_TIMEOUT_SEC
              value: "25"
            {{- range $k, $v := .Values.ingestService.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if .Values.ingestService.secretEnv.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.ingestService.secretEnv.existingSecret }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.ingestListener.resources | nindent 12 }}
          volumeMounts:
            # Files that feed secretRefs name as file:/etc/sentinel/tak/... (TAK
            # client certificate, key and CA). The Secret is optional.
            - name: tak-secrets
              mountPath: {{ .Values.ingestService.tak.mountPath }}
              readOnly: true
            {{- if .Values.ingestService.secretFiles.existingSecret }}
            # Files that feed secretRefs name as file:/etc/sentinel/secrets/...
            # (TLS certificates and keys, for example): one per key of the Secret.
            - name: secret-files
              mountPath: {{ .Values.ingestService.secretFiles.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tak-secrets
          secret:
            secretName: {{ default (printf "%s-ingest-tak" (include "sentinel.fullname" .)) .Values.ingestService.tak.existingSecret }}
            optional: true
            # Group-readable by the pod's fsGroup only, like the secret-files volume.
            defaultMode: 0440
            items:
              - key: tak-client-cert
                path: client.pem
              - key: tak-client-key
                path: client.key
              - key: tak-ca
                path: ca.pem
        {{- if .Values.ingestService.secretFiles.existingSecret }}
        - name: secret-files
          secret:
            secretName: {{ .Values.ingestService.secretFiles.existingSecret }}
            defaultMode: 0440
        {{- end }}
{{- end }}
