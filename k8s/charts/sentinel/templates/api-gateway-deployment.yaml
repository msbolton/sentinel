apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sentinel.fullname" . }}-api-gateway
  labels:
    {{- include "sentinel.labels" (dict "ctx" $ "component" "api-gateway" "tier" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.apiGateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "sentinel.selectorLabels" (dict "ctx" $ "component" "api-gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sentinel.podLabels" (dict "ctx" $ "component" "api-gateway") | nindent 8 }}
    spec:
      {{- with (include "sentinel.imagePullSecrets" .) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: api-gateway
          image: {{ include "sentinel.image" (dict "ctx" $ "image" .Values.apiGateway.image) | quote }}
          imagePullPolicy: {{ .Values.apiGateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: DB_HOST
              value: {{ include "sentinel.postgresHost" . }}
            - name: DB_PORT
              value: "5432"
            - name: DB_DATABASE
              value: sentinel
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "sentinel.postgresHost" . }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sentinel.postgresHost" . }}
                  key: password
            - name: KAFKA_BROKERS
              value: {{ include "sentinel.kafkaBrokers" . }}
            - name: KEYCLOAK_URL
              value: {{ include "sentinel.keycloakInternalUrl" . }}
            - name: KEYCLOAK_REALM
              value: sentinel
            - name: APP_ENV
              value: production
            - name: INGEST_SERVICE_URL
              value: http://{{ include "sentinel.fullname" . }}-ingest-service:{{ .Values.ingestService.service.port }}
            - name: INGEST_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-ingest" (include "sentinel.fullname" .)) .Values.ingestService.existingSecret }}
                  key: service-token
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.apiGateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentinel.fullname" . }}-api-gateway
  labels:
    {{- include "sentinel.labels" (dict "ctx" $ "component" "api-gateway") | nindent 4 }}
spec:
  type: {{ .Values.apiGateway.service.type }}
  ports:
    - port: {{ .Values.apiGateway.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "sentinel.selectorLabels" (dict "ctx" $ "component" "api-gateway") | nindent 4 }}
