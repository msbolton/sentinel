{{- $secretName := default (printf "%s-ingest" (include "sentinel.fullname" .)) .Values.ingestService.existingSecret -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sentinel.fullname" . }}-ingest-service
  labels:
    {{- include "sentinel.labels" (dict "ctx" $ "component" "ingest-service" "tier" "ingest") | nindent 4 }}
spec:
  replicas: {{ .Values.ingestService.replicaCount }}
  selector:
    matchLabels:
      {{- include "sentinel.selectorLabels" (dict "ctx" $ "component" "ingest-service") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sentinel.podLabels" (dict "ctx" $ "component" "ingest-service") | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      {{- with .Values.ingestService.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (include "sentinel.imagePullSecrets" .) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: ingest-service
          image: {{ include "sentinel.image" (dict "ctx" $ "image" .Values.ingestService.image) | quote }}
          imagePullPolicy: {{ .Values.ingestService.image.pullPolicy | default "IfNotPresent" }}
          {{- with .Values.ingestService.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: APP_ENV
              value: production
            - name: HTTP_ADDR
              value: ":4000"
            - name: REPLICA_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_BROKERS
              value: {{ include "sentinel.kafkaBrokers" . }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "sentinel.postgresHost" . }}
                  key: database-url
            - name: INGEST_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: service-token
            - name: OPENSKY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: opensky-client-id
                  optional: true
            - name: OPENSKY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: opensky-client-secret
                  optional: true
            - name: LEASE_TTL_SEC
              value: {{ .Values.ingestService.lease.ttlSec | quote }}
            - name: LEASE_TICK_SEC
              value: {{ .Values.ingestService.lease.tickSec | quote }}
            - name: LEASE_REBALANCE_SEC
              value: {{ .Values.ingestService.lease.rebalanceSec | quote }}
            - name: SHUTDOWN_TIMEOUT_SEC
              value: "25"
            {{- range $k, $v := .Values.ingestService.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if .Values.ingestService.secretEnv.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.ingestService.secretEnv.existingSecret }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.ingestService.resources | nindent 12 }}
          volumeMounts:
            # Files that feed secretRefs name as file:/etc/sentinel/tak/... (TAK
            # client certificate, key and CA). The Secret is optional.
            - name: tak-secrets
              mountPath: {{ .Values.ingestService.tak.mountPath }}
              readOnly: true
            {{- if .Values.ingestService.secretFiles.existingSecret }}
            # Files that feed secretRefs name as file:/etc/sentinel/secrets/...
            # (TLS certificates and keys, for example): one per key of the Secret.
            - name: secret-files
              mountPath: {{ .Values.ingestService.secretFiles.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tak-secrets
          secret:
            secretName: {{ default (printf "%s-ingest-tak" (include "sentinel.fullname" .)) .Values.ingestService.tak.existingSecret }}
            optional: true
            # Group-readable by the pod's fsGroup only, like the secret-files volume.
            defaultMode: 0440
            items:
              - key: tak-client-cert
                path: client.pem
              - key: tak-client-key
                path: client.key
              - key: tak-ca
                path: ca.pem
        {{- if .Values.ingestService.secretFiles.existingSecret }}
        - name: secret-files
          secret:
            secretName: {{ .Values.ingestService.secretFiles.existingSecret }}
            defaultMode: 0440
        {{- end }}
---
{{- if and (not .Values.ingestService.tak.existingSecret) .Values.ingestService.tak.clientCert }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sentinel.fullname" . }}-ingest-tak
  labels:
    {{- include "sentinel.labels" (dict "ctx" $ "component" "ingest-service") | nindent 4 }}
type: Opaque
stringData:
  tak-client-cert: {{ .Values.ingestService.tak.clientCert | quote }}
  tak-client-key: {{ .Values.ingestService.tak.clientKey | quote }}
  tak-ca: {{ .Values.ingestService.tak.ca | quote }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentinel.fullname" . }}-ingest-service
  labels:
    {{- include "sentinel.labels" (dict "ctx" $ "component" "ingest-service") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.ingestService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "sentinel.selectorLabels" (dict "ctx" $ "component" "ingest-service") | nindent 4 }}
{{- if not .Values.ingestService.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "sentinel.labels" (dict "ctx" $ "component" "ingest-service") | nindent 4 }}
type: Opaque
stringData:
  service-token: {{ required "ingestService.serviceToken (or ingestService.existingSecret) is required" .Values.ingestService.serviceToken | quote }}
  {{- if .Values.ingestService.opensky.clientId }}
  opensky-client-id: {{ .Values.ingestService.opensky.clientId | quote }}
  opensky-client-secret: {{ .Values.ingestService.opensky.clientSecret | quote }}
  {{- end }}
{{- end }}
{{- if .Values.ingestService.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "sentinel.fullname" . }}-ingest-service
  labels:
    {{- include "sentinel.labels" (dict "ctx" $ "component" "ingest-service") | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "sentinel.selectorLabels" (dict "ctx" $ "component" "ingest-service") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.ingestService.serviceMonitor.interval }}
{{- end }}
