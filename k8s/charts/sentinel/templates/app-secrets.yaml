{{- if not .Values.keycloak.clientsExistingSecret }}
{{- $name := include "sentinel.keycloakClientsSecret" . }}
# The client secret of Keycloak's sentinel-service client, for the gateway's
# registration flow and for Keycloak itself. Generated once and read back on
# every upgrade; resource-policy keep leaves it behind on helm uninstall, so a
# reinstall onto Keycloak's kept database still matches it.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "sentinel.labels" (dict "ctx" $ "component" "keycloak") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  service-client-secret: {{ include "sentinel.secretValue" (dict "ctx" $ "name" $name "key" "service-client-secret") | quote }}
{{- end }}
{{- if and .Values.mail.password (not .Values.mail.existingSecret) }}
---
# The SMTP password of the registration mail (mail in values.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sentinel.fullname" . }}-mail
  labels:
    {{- include "sentinel.labels" (dict "ctx" $ "component" "api-gateway") | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.mail.password | quote }}
{{- end }}
