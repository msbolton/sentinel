{{- if .Values.dbSchema.enabled }}
{{- $name := printf "%s-db-schema" (include "sentinel.fullname" .) | trunc 63 | trimSuffix "-" }}
{{- $files := .Files.Glob "files/schema/*.sql" }}
{{- if not $files }}
{{- fail "dbSchema: files/schema holds no .sql files; it must link to db/schema (or set dbSchema.enabled=false)" }}
{{- end }}
# Applies db/schema for the services: after a first install has created the
# release's resources, and before every upgrade changes them. The SQL comes
# from files/schema, a link to db/schema, so Compose, make db-schema and this
# chart apply the same files.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "sentinel.labels" (dict "ctx" $ "component" "db-schema") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    # Only before-hook-creation: the ConfigMap is not deleted after the Job. It
    # stays until the next install or upgrade replaces it, and after helm
    # uninstall.
    helm.sh/hook-delete-policy: before-hook-creation
data:
{{ $files.AsConfig | indent 2 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "sentinel.labels" (dict "ctx" $ "component" "db-schema") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.dbSchema.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.dbSchema.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "sentinel.podLabels" (dict "ctx" $ "component" "db-schema") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.dbSchema.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (include "sentinel.imagePullSecrets" .) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: db-schema
          image: {{ .Values.dbSchema.image | quote }}
          imagePullPolicy: IfNotPresent
          {{- with .Values.dbSchema.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Waits for the database, then runs the files in name order as the
          # db-schema Compose job does. pg_isready exits 3 when it made no
          # attempt (an invalid DATABASE_URL), which waiting cannot fix, so the
          # script stops there and retries every other status. The first psql
          # error fails the Job, and Helm then fails the install or upgrade.
          # psql -X skips any psqlrc, so nothing in the image can change how a
          # schema file is run.
          command: ["/bin/sh", "-c"]
          args:
            - |
              until pg_isready -d "$DATABASE_URL"; do
                if [ $? -eq 3 ]; then
                  echo "DATABASE_URL is not a valid connection string" >&2
                  exit 3
                fi
                sleep 2
              done
              for f in /schema/*.sql; do
                echo "== $f"
                psql -X -v ON_ERROR_STOP=1 -q -f "$f" "$DATABASE_URL" || exit 1
              done
          env:
            # The role the services connect as, so it owns what this creates:
            # the startup schema check reads information_schema.columns, which
            # lists only the columns the connecting role can access.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "sentinel.postgresHost" . }}
                  key: database-url
          resources:
            {{- toYaml .Values.dbSchema.resources | nindent 12 }}
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
      volumes:
        - name: schema
          configMap:
            name: {{ $name }}
{{- end }}
