{{- if .Values.dbSchema.enabled }}
{{- $files := .Files.Glob "files/schema/*.sql" }}
{{- if not $files }}
{{- fail "dbSchema: files/schema holds no .sql files; it must link to db/schema (or set dbSchema.enabled=false)" }}
{{- end }}
# Applies db/schema for the services: after a first install has created the
# release's resources, and before every upgrade changes them. The SQL comes
# from files/schema, a link to db/schema, so Compose, make db-schema and this
# chart apply the same files.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sentinel.fullname" . }}-db-schema
  labels:
    app.kubernetes.io/name: db-schema
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    # Not hook-succeeded: Helm does not wait on a ConfigMap, so that policy could
    # delete it before the Job has mounted it.
    helm.sh/hook-delete-policy: before-hook-creation
data:
{{ $files.AsConfig | indent 2 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sentinel.fullname" . }}-db-schema
  labels:
    app.kubernetes.io/name: db-schema
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.dbSchema.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.dbSchema.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-schema
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-schema
          image: {{ .Values.dbSchema.image | quote }}
          imagePullPolicy: IfNotPresent
          # Waits for the database, then runs the files in name order as the
          # db-schema Compose job does. The first error fails the Job, and Helm
          # then fails the install or upgrade.
          command: ["/bin/sh", "-c"]
          args:
            - |
              until pg_isready -d "$DATABASE_URL"; do sleep 2; done
              for f in /schema/*.sql; do
                echo "== $f"
                psql -v ON_ERROR_STOP=1 -q -f "$f" "$DATABASE_URL" || exit 1
              done
          env:
            # The role the services connect as, so it owns what this creates:
            # the startup schema check reads information_schema.columns, which
            # lists only the columns the connecting role can access.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgresql
                  key: database-url
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
      volumes:
        - name: schema
          configMap:
            name: {{ include "sentinel.fullname" . }}-db-schema
{{- end }}
