{{- if .Values.web.enabled }}
{{- $v := .Values.web }}
{{- $fullname := printf "%s-web" (include "sentinel.fullname" .) }}
{{- $keys := $v.mapKeys }}
{{- range $k := list "googleMapsApiKey" "cesiumIonAccessToken" }}
{{- if not (regexMatch "^[A-Za-z0-9._-]*$" (index $keys $k | default "" | toString)) }}
{{- fail (printf "web.mapKeys.%s may only hold [A-Za-z0-9._-]: the container refuses to start otherwise" $k) }}
{{- end }}
{{- end }}
{{- $keySecret := $keys.existingSecret }}
{{- if and (not $keySecret) (or $keys.googleMapsApiKey $keys.cesiumIonAccessToken) }}
{{- $keySecret = $fullname }}
{{- end }}
# Replaces the image's /etc/nginx/conf.d/default.conf, whose proxy blocks name
# the Compose hosts api-gateway and keycloak: nginx resolves a proxy_pass host
# at start and would not start here. The Ingress routes /api, /ws and /auth, so
# this server serves the static site only. IPv4 only: a pod may have no IPv6.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-nginx
  labels:
    {{- include "sentinel.labels" (dict "ctx" $ "component" "web" "tier" "web") | nindent 4 }}
data:
  default.conf: |
    {{- include "sentinel.webNginxConf" . | nindent 4 }}
---
{{- if and $keySecret (not $keys.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $keySecret }}
  labels:
    {{- include "sentinel.labels" (dict "ctx" $ "component" "web" "tier" "web") | nindent 4 }}
type: Opaque
stringData:
  {{- with $keys.googleMapsApiKey }}
  google-maps-api-key: {{ . | quote }}
  {{- end }}
  {{- with $keys.cesiumIonAccessToken }}
  cesium-ion-access-token: {{ . | quote }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "sentinel.labels" (dict "ctx" $ "component" "web" "tier" "web") | nindent 4 }}
spec:
  replicas: {{ $v.replicaCount }}
  selector:
    matchLabels:
      {{- include "sentinel.selectorLabels" (dict "ctx" $ "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sentinel.podLabels" (dict "ctx" $ "component" "web") | nindent 8 }}
      annotations:
        # A changed default.conf rolls the pods; the mounted file would change
        # under a running nginx that never reloads it.
        checksum/nginx: {{ include "sentinel.webNginxConf" . | sha256sum | trunc 16 }}
    spec:
      {{- with $v.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (include "sentinel.imagePullSecrets" .) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "sentinel.image" (dict "ctx" $ "image" $v.image) | quote }}
          imagePullPolicy: {{ $v.image.pullPolicy | default "IfNotPresent" }}
          {{- with $v.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 4200
              protocol: TCP
          {{- with $keySecret }}
          # Written into /config.json at container start; a missing key is an
          # empty value.
          env:
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: google-maps-api-key
                  optional: true
            - name: CESIUM_ION_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: cesium-ion-access-token
                  optional: true
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            # config.json, written by the entrypoint.
            - name: runtime-config
              mountPath: /var/run/sentinel
            # nginx's pid file and temp paths.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ $fullname }}-nginx
        - name: runtime-config
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "sentinel.labels" (dict "ctx" $ "component" "web") | nindent 4 }}
spec:
  type: {{ $v.service.type }}
  ports:
    - port: {{ $v.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "sentinel.selectorLabels" (dict "ctx" $ "component" "web") | nindent 4 }}
{{- end }}

{{- define "sentinel.webNginxConf" -}}
server {
    listen 4200;
    server_name _;
    include /etc/nginx/sentinel/static.conf;
}
{{- end }}
