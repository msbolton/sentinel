# k3s only: settings for the Traefik that k3s installs from its bundled chart.
# k3s applies a HelmChartConfig in kube-system named after the chart and
# redeploys Traefik with these values merged in. Apply once:
#   kubectl apply -f k8s/cluster/traefik-config.yaml
# (or copy it to /var/lib/rancher/k3s/server/manifests/ on the server).
#
# externalTrafficPolicy: Local keeps the client's address on the way in: with
# Cluster the node rewrites it to its own, and Traefik's X-Forwarded-For, which
# the gateway's registration rate limiter keys on, would name the node for
# every visitor. Local only answers on nodes running a Traefik pod, which on a
# single node is that node.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        externalTrafficPolicy: Local
