# Development environment overrides
# helm upgrade --install sentinel-dev ./k8s/charts/sentinel -f k8s/overlays/dev/values.yaml -n sentinel-dev

global:
  host: sentinel.dev.local

apiGateway:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

entityService:
  replicaCount: 1

trackService:
  replicaCount: 1

searchService:
  replicaCount: 1

linkAnalysisService:
  replicaCount: 1

alertService:
  replicaCount: 1

ingestService:
  replicaCount: 1

# TCP/UDP listening connections need the ingest listener, which only runs on a
# labelled node. To enable it, label a node
# (kubectl label node <name> sentinel.io/ingest-listener=true) and set enabled: true.
ingestListener:
  enabled: false

web:
  replicaCount: 1
  ingress:
    enabled: true
    hosts:
      - host: sentinel.dev.local
        paths:
          - path: /
            pathType: Prefix
