# Development environment overrides
apiGateway:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

entityService:
  replicaCount: 1

trackService:
  replicaCount: 1

searchService:
  replicaCount: 1

linkAnalysisService:
  replicaCount: 1

alertService:
  replicaCount: 1

ingestService:
  replicaCount: 1

# TCP/UDP listening connections need the ingest listener, which only runs on a
# labelled node. To enable it, label a node
# (kubectl label node <name> sentinel.io/ingest-listener=true) and set enabled: true.
ingestListener:
  enabled: false

analyticsService:
  replicaCount: 1

web:
  replicaCount: 1
  ingress:
    enabled: true
    hosts:
      - host: sentinel.dev.local
        paths:
          - path: /
            pathType: Prefix

postgresql:
  primary:
    persistence:
      size: 10Gi

kafka:
  controller:
    replicaCount: 1
  provisioning:
    topics:
      - name: observations.raw
        partitions: 6
        replicationFactor: 1
      - name: observations.dlq
        partitions: 1
        replicationFactor: 1
      - name: entities.events
        partitions: 3
        replicationFactor: 1
      - name: alerts.events
        partitions: 1
        replicationFactor: 1
      - name: density.events
        partitions: 1
        replicationFactor: 1
